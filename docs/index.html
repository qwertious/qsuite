<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>qDocs</title>
    <meta name="description" content="A local document maker. Your documents never leave this device." />
    <link rel="stylesheet" href="../qsuite.css" />
    <style>
      /* qDocs-specific layout only. Every colour below is a token from
         qsuite.css -- nothing here hard-codes a hex, so the light theme and
         any future theme work without touching this file. */

      .qd-search-wrap {
        position: relative;
        padding: var(--space-3);
        border-bottom: 1px solid var(--border);
      }

      .qd-search-clear {
        position: absolute;
        right: calc(var(--space-3) + 6px);
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--text-faint);
        font-size: 1.1rem;
        cursor: pointer;
        padding: 4px;
        line-height: 1;
      }

      .qd-search-clear:hover { color: var(--text); }

      .qd-list-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--space-2) var(--space-3);
        font-size: 0.8rem;
        color: var(--text-faint);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      #docList { list-style: none; }

      /* A real <button>, not a div with onclick: it is focusable, reachable by
         keyboard, and announced as a control by screen readers for free. */
      .qd-doc-item {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        border-left: 3px solid transparent;
        padding: var(--space-2) var(--space-3);
        color: var(--text);
        font-family: inherit;
        font-size: 0.92rem;
        cursor: pointer;
      }

      .qd-doc-item:hover { background-color: var(--bg-hover); }

      .qd-doc-item.qd-active {
        background-color: var(--bg-hover);
        border-left-color: var(--accent);
      }

      .qd-doc-title {
        display: block;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .qd-doc-time {
        display: block;
        font-size: 0.75rem;
        color: var(--text-faint);
        margin-top: 1px;
      }

      .qd-doc-snippet {
        display: block;
        font-size: 0.78rem;
        color: var(--text-muted);
        margin-top: var(--space-1);
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      .qd-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-1);
        padding: var(--space-2) var(--space-3);
        border-bottom: 1px solid var(--border);
        background-color: var(--bg-header);
        flex: 0 0 auto;
      }

      .qd-toolbar .qs-btn {
        padding: var(--space-1) var(--space-2);
        min-width: 32px;
        font-size: 0.9rem;
      }

      .qd-tool-sep {
        width: 1px;
        background-color: var(--border);
        margin: 2px var(--space-1);
      }

      #titleInput {
        border: none;
        background: none;
        font-size: 1.5rem;
        font-weight: 600;
        padding: var(--space-4) var(--space-5) var(--space-1);
        width: 100%;
        font-family: inherit;
        color: var(--text);
      }

      #titleInput:focus { outline: none; }
      #titleInput::placeholder { color: var(--text-faint); }

      #docMeta {
        padding: 0 var(--space-5) var(--space-3);
        font-size: 0.78rem;
        color: var(--text-faint);
        flex: 0 0 auto;
      }

      #editor {
        flex: 1 1 auto;
        overflow-y: auto;
        min-height: 0;
        padding: 0 var(--space-5) var(--space-6);
        font-size: 1rem;
        line-height: 1.7;
        outline: none;
      }

      /* Give the caret somewhere to sit in an empty document, and hint at it. */
      #editor:empty::before {
        content: "Start writing...";
        color: var(--text-faint);
      }

      #editor h1 { font-size: 1.6rem; margin: 1.2em 0 0.4em; }
      #editor h2 { font-size: 1.3rem; margin: 1.2em 0 0.4em; }
      #editor h3 { font-size: 1.1rem; margin: 1.2em 0 0.4em; }
      #editor p { margin: 0 0 0.9em; }
      #editor ul, #editor ol { margin: 0 0 0.9em 1.5em; }
      #editor blockquote {
        margin: 0 0 0.9em;
        padding-left: var(--space-4);
        border-left: 3px solid var(--border-strong);
        color: var(--text-muted);
      }
      #editor code {
        font-family: var(--font-mono);
        background-color: var(--bg-sunken);
        padding: 0.1em 0.35em;
        border-radius: var(--radius-sm);
      }
      #editor pre {
        background-color: var(--bg-sunken);
        padding: var(--space-3);
        border-radius: var(--radius);
        overflow-x: auto;
        margin: 0 0 0.9em;
      }
      #editor hr {
        border: none;
        border-top: 1px solid var(--border-strong);
        margin: var(--space-5) 0;
      }
      #editor a { color: var(--accent); }
      #editor img { max-width: 100%; height: auto; }

      .qd-editor-actions {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        /* Wrap rather than squeeze: without this the buttons compress until
           their labels break across three lines on a narrow editor pane. */
        flex-wrap: wrap;
        padding: var(--space-2) var(--space-3);
        border-top: 1px solid var(--border);
        background-color: var(--bg-header);
        flex: 0 0 auto;
      }

      .qd-editor-actions .qs-btn { white-space: nowrap; }

      #exportSelect { width: auto; min-width: 150px; }
      #driveFormat { width: auto; }

      .qd-brand {
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
      }

      @media (max-width: 860px) {
        #titleInput, #docMeta, #editor { padding-left: var(--space-4); padding-right: var(--space-4); }
      }

      /* The print path is used by the PDF export as a fallback if the popup is
         blocked, so the app chrome must not appear on paper. */
      @media print {
        .qs-topbar, .qs-sidebar, .qd-toolbar, .qd-editor-actions, #docMeta { display: none !important; }
        #editor { overflow: visible; padding: 0; }
        body { background: #fff; color: #000; }
      }
    </style>
  </head>

  <body>
    <div class="qs-app">
      <header class="qs-topbar">
        <button id="menuBtn" class="qs-btn qs-icon-btn qs-only-mobile" aria-label="Show documents">☰</button>
        <h1>qDocs</h1>
        <span class="qs-faint qs-only-desktop">Stored on this device only</span>
        <span class="qs-spacer"></span>
        <a class="qd-brand" href="../">qSuite</a>
        <button id="themeBtn" class="qs-btn qs-icon-btn" aria-label="Switch theme">☀</button>
      </header>

      <div class="qs-body">
        <aside class="qs-sidebar" id="sidebar">
          <div class="qd-search-wrap">
            <label class="qs-visually-hidden" for="searchInput">Search documents</label>
            <input
              id="searchInput"
              class="qs-input"
              type="search"
              placeholder="Search documents..."
              autocomplete="off"
            />
            <button id="searchClear" class="qd-search-clear" hidden aria-label="Clear search">×</button>
          </div>

          <div class="qd-list-head">
            <span id="docCount">0 documents</span>
            <button id="newDocBtn" class="qs-btn qs-btn-primary" style="padding:2px 10px;font-size:0.8rem">+ New</button>
          </div>

          <ul id="docList" class="qs-scroll" style="flex:1 1 auto"></ul>
        </aside>
        <div class="qs-sidebar-scrim" id="sidebarScrim" hidden></div>

        <main class="qs-main">
          <div class="qs-empty" id="emptyState">
            <p style="font-size:1.1rem;margin-bottom:var(--space-3)">No document open</p>
            <p>Create one to get started. Everything you write stays in this browser.</p>
          </div>

          <div class="qs-main" id="editorPane" hidden>
            <div class="qd-toolbar" role="toolbar" aria-label="Formatting">
              <button class="qs-btn" data-cmd="bold" title="Bold (Ctrl+B)" aria-label="Bold"><b>B</b></button>
              <button class="qs-btn" data-cmd="italic" title="Italic (Ctrl+I)" aria-label="Italic"><i>I</i></button>
              <button class="qs-btn" data-cmd="underline" title="Underline" aria-label="Underline"><u>U</u></button>
              <button class="qs-btn" data-cmd="strikeThrough" title="Strikethrough" aria-label="Strikethrough"><s>S</s></button>
              <span class="qd-tool-sep" aria-hidden="true"></span>
              <button class="qs-btn" data-cmd="formatBlock" data-value="h1" title="Heading 1" aria-label="Heading 1">H1</button>
              <button class="qs-btn" data-cmd="formatBlock" data-value="h2" title="Heading 2" aria-label="Heading 2">H2</button>
              <button class="qs-btn" data-cmd="formatBlock" data-value="h3" title="Heading 3" aria-label="Heading 3">H3</button>
              <button class="qs-btn" data-cmd="formatBlock" data-value="p" title="Normal text" aria-label="Normal text">¶</button>
              <span class="qd-tool-sep" aria-hidden="true"></span>
              <button class="qs-btn" data-cmd="insertUnorderedList" title="Bulleted list" aria-label="Bulleted list">• List</button>
              <button class="qs-btn" data-cmd="insertOrderedList" title="Numbered list" aria-label="Numbered list">1. List</button>
              <button class="qs-btn" data-cmd="formatBlock" data-value="blockquote" title="Quote" aria-label="Quote">❝</button>
              <button class="qs-btn" data-cmd="formatBlock" data-value="pre" title="Code block" aria-label="Code block">&lt;/&gt;</button>
              <span class="qd-tool-sep" aria-hidden="true"></span>
              <button class="qs-btn" data-cmd="createLink" title="Insert link" aria-label="Insert link">🔗</button>
              <button class="qs-btn" data-cmd="insertHorizontalRule" title="Divider" aria-label="Divider">—</button>
              <button class="qs-btn" data-cmd="removeFormat" title="Clear formatting" aria-label="Clear formatting">✕</button>
            </div>

            <label class="qs-visually-hidden" for="titleInput">Document title</label>
            <input id="titleInput" type="text" placeholder="Untitled document" autocomplete="off" />
            <div id="docMeta"></div>

            <div
              id="editor"
              contenteditable="true"
              role="textbox"
              aria-multiline="true"
              aria-label="Document body"
              spellcheck="true"
            ></div>

            <div class="qd-editor-actions">
              <label class="qs-visually-hidden" for="exportSelect">Export format</label>
              <select id="exportSelect" class="qs-select"></select>
              <button id="exportBtn" class="qs-btn qs-btn-primary">Export</button>

              <span class="qd-tool-sep" aria-hidden="true"></span>

              <label class="qs-visually-hidden" for="driveFormat">Format to save into qDrive</label>
              <select id="driveFormat" class="qs-select" style="min-width:150px">
                <option value="html">qDocs document</option>
                <option value="md">Markdown</option>
                <option value="txt">Plain text</option>
                <option value="docx">Word</option>
              </select>
              <button id="driveSaveBtn" class="qs-btn" title="Save a copy into qDrive so you can send it to another device">
                Save to qDrive
              </button>
              <button id="driveOpenBtn" class="qs-btn" title="Open a document stored in qDrive">
                Open from qDrive
              </button>

              <span class="qs-spacer"></span>
              <button id="deleteBtn" class="qs-btn qs-btn-danger">Delete</button>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div class="qs-modal" id="drivePicker" hidden>
      <div class="qs-modal-card">
        <h2>Open from qDrive</h2>
        <p class="qs-faint" style="margin-bottom:var(--space-3)">
          Documents stored in qDrive on this device &mdash; including any copied across
          from another one.
        </p>
        <ul id="drivePickerList" style="list-style:none"></ul>
        <div class="qs-modal-actions">
          <button class="qs-btn" id="drivePickerClose">Cancel</button>
        </div>
      </div>
    </div>

    <div class="qs-toast" id="toast" role="status" aria-live="polite"></div>

    <style>
      /* Visually hidden but still read by screen readers -- used for the
         labels above, which would otherwise clutter a deliberately spare UI. */
      .qs-visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
      @media (max-width: 860px) {
        .qs-only-desktop { display: none !important; }
      }
    </style>

    <script src="zip.js"></script>
    <script src="store.js"></script>
    <script src="export.js"></script>
    <!-- qDrive's storage module, reused as-is. Same origin, so qDocs can read
         and write the drive directly; it has no account or network dependency,
         so this does not drag any of that into qDocs. -->
    <script src="../drive/store.js"></script>
    <script src="app.js"></script>
  </body>
</html>
